[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rexa"
version = "0.1.0"
description = "REXA real-estate assistant module"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.25",
    "langchain-openai>=0.3.16",
    "langchain-google-genai>=2.1.0",
    "langchain-core>=0.3.58",
    "openai>=1.75.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "boto3",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["rexa*"]

[tool.setuptools]
py-modules = ["main"]

[project.scripts]
rexa = "rexa.__main__:main"
